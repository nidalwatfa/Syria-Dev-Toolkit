<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>✅ إدارة المهام</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { margin-bottom: 20px; }
    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 60%;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    li {
      background: #1e293b;
      margin: 5px auto;
      padding: 10px;
      border-radius: 6px;
      width: 60%;
    }
    select {
      margin-top: 20px;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1 id="pageTitle">✅ إدارة المهام</h1>

  <input id="taskInput" type="text" placeholder="أدخل مهمة جديدة">
  <button id="addTaskBtn">إضافة مهمة</button>

  <ul id="taskList"></ul>

  <!-- اختيار اللغة -->
  <select onchange="loadTranslations(this.value)">
    <option value="ar">العربية</option>
    <option value="ku">Kurdî</option>
    <option value="en">English</option>
  </select>

  <script>
    async function loadTranslations(lang) {
      const res = await fetch("translations.json");
      const data = await res.json();
      const t = data[lang] || data["ar"]; // افتراضي عربي

      // تغيير النصوص في صفحة المهام
      document.getElementById("pageTitle").textContent = t.title_tasks;
      document.getElementById("taskInput").placeholder = t.new_task;
      document.getElementById("addTaskBtn").textContent = t.add_task;
    }

    // افتراضي: اللغة العربية
    loadTranslations("ar");

    // منطق إضافة المهام
    document.getElementById("addTaskBtn").addEventListener("click", () => {
      const taskInput = document.getElementById("taskInput");
      const taskList = document.getElementById("taskList");

      if (taskInput.value.trim() !== "") {
        const li = document.createElement("li");
        li.textContent = taskInput.value;
        taskList.appendChild(li);
        taskInput.value = "";
      }
    });
  </script>
</body>
</html>
