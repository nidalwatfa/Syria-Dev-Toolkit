
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>✅ إدارة المهام</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 60%;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      margin: 5px;
      cursor: pointer;
    }
    #addTaskBtn { background: #22c55e; color: white; }
    .deleteBtn { background: #ef4444; color: white; }
    #clearTasksBtn { background: #ef4444; color: white; }
    #exportTasksBtn { background: #3b82f6; color: white; }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    li {
      background: #1e293b;
      margin: 5px auto;
      padding: 10px;
      border-radius: 6px;
      width: 60%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1 id="pageTitle">✅ إدارة المهام</h1>

  <input id="taskInput" type="text" placeholder="أدخل مهمة جديدة">
  <button id="addTaskBtn">➕ إضافة مهمة</button>
  <button id="clearTasksBtn">🗑️ مسح جميع المهام</button>
  <button id="exportTasksBtn">⬇️ تصدير المهام</button>

  <ul id="taskList"></ul>

  <script>
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    // تحميل المهام عند فتح الصفحة
    window.onload = () => {
      const savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];
      savedTasks.forEach(task => addTaskToList(task));
    };

    // إضافة مهمة جديدة
    document.getElementById("addTaskBtn").addEventListener("click", () => {
      if (taskInput.value.trim() !== "") {
        addTaskToList(taskInput.value);
        saveTask(taskInput.value);
        taskInput.value = "";
      }
    });

    // إضافة المهمة إلى القائمة
    function addTaskToList(task) {
      const li = document.createElement("li");
      li.textContent = task;

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "❌";
      deleteBtn.className = "deleteBtn";
      deleteBtn.onclick = () => {
        li.remove();
        deleteTask(task);
      };

      li.appendChild(deleteBtn);
      taskList.appendChild(li);
    }

    // حفظ المهمة في LocalStorage
    function saveTask(task) {
      const tasks = JSON.parse(localStorage.getItem("tasks")) || [];
      tasks.push(task);
