<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>📝 الملاحظات</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { margin-bottom: 20px; }
    textarea {
      width: 90%;
      height: 200px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
    select {
      margin-top: 20px;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1 id="pageTitle">📝 الملاحظات</h1>

  <textarea id="notesArea" placeholder="اكتب ملاحظاتك هنا..."></textarea>
  <br>
  <button id="saveBtn">💾 حفظ الملاحظات</button>

  <!-- اختيار اللغة -->
  <select onchange="loadTranslations(this.value)">
    <option value="ar">العربية</option>
    <option value="ku">Kurdî</option>
    <option value="en">English</option>
  </select>

  <script>
    // تحميل الترجمة
    async function loadTranslations(lang) {
      const res = await fetch("translations.json");
      const data = await res.json();
      const t = data[lang] || data["ar"]; // افتراضي عربي

      document.getElementById("pageTitle").textContent = t.title_notes;
      document.getElementById("notesArea").placeholder = t.title_notes;
      document.getElementById("saveBtn").textContent = t.save_notes;
    }

    loadTranslations("ar");

    const notesArea = document.getElementById("notesArea");

    // تحميل الملاحظات من LocalStorage عند فتح الصفحة
    window.onload = () => {
      const savedNotes = localStorage.getItem("notes");
      if (savedNotes) {
        notesArea.value = savedNotes;
      }
    };

    // حفظ الملاحظات في LocalStorage
    document.getElementById("saveBtn").addEventListener("click", () => {
      localStorage.setItem("notes", notesArea.value);
      alert("✅ تم حفظ الملاحظات بنجاح!");
    });
  </script>
</body>
</html>
