<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>🏠 الصفحة الرئيسية</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 40px;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
    }
    a {
      display: block;
      margin: 15px auto;
      padding: 15px;
      width: 60%;
      background: #1e293b;
      color: #e5e7eb;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      transition: background 0.3s;
    }
    a:hover {
      background: #3b82f6;
    }
    select {
      margin-top: 30px;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1 id="pageTitle">🏠 الصفحة الرئيسية</h1>

  <a id="notesLink" href="notes.html">📝 الملاحظات</a>
  <a id="tasksLink" href="tasks.html">✅ المهام</a>
  <a id="jsonLink" href="json-viewer.html">📂 عارض JSON</a>

  <!-- اختيار اللغة -->
  <select onchange="loadTranslations(this.value)">
    <option value="ar">العربية</option>
    <option value="ku">Kurdî</option>
    <option value="en">English</option>
  </select>

  <script>
    // تحميل الترجمة
    async function loadTranslations(lang) {
      const res = await fetch("translations.json");
      const data = await res.json();
      const t = data[lang] || data["ar"]; // افتراضي عربي

      document.getElementById("pageTitle").textContent = t.title_home;
      document.getElementById("notesLink").textContent = "📝 " + t.title_notes;
      document.getElementById("tasksLink").textContent = "✅ " + t.title_tasks;
      document.getElementById("jsonLink").textContent = "📂 " + t.title_json;
    }

    // تحميل اللغة الافتراضية عند فتح الصفحة
    loadTranslations("ar");
  </script>
</body>
</html>
