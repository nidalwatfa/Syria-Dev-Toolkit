<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>i18n Example with Dropdown</title>
  <script src="https://unpkg.com/i18next@21.6.16/dist/umd/i18next.min.js"></script>
</head>
<body>
  <h1 id="welcome"></h1>
  
  <p>
    <button id="login"></button>
    <button id="logout"></button>
    <button id="save"></button>
    <button id="cancel"></button>
    <button id="exit"></button>
    <button id="settings"></button>
    <button id="language"></button>
  </p>

  <p>
    <label for="langSelect">🌐 اختر اللغة:</label>
    <select id="langSelect" onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="ku">Kurdî</option>
    </select>
  </p>

  <script>
    // الموارد (النصوص المترجمة)
    const resources = {
      ar: {
        translation: {
          welcome_message: "مرحباً بك!",
          login: "تسجيل الدخول",
          logout: "تسجيل الخروج",
          settings: "الإعدادات",
          language: "اللغة",
          save: "حفظ",
          cancel: "إلغاء",
          exit: "خروج"
        }
      },
      en: {
        translation: {
          welcome_message: "Welcome!",
          login: "Login",
          logout: "Logout",
          settings: "Settings",
          language: "Language",
          save: "Save",
          cancel: "Cancel",
          exit: "Exit"
        }
      },
      ku: {
        translation: {
          welcome_message: "Slav û bi xêr hatî!",
          login: "Têkeve",
          logout: "Derkeve",
          settings: "Mîheng",
          language: "Ziman",
          save: "Tomar bike",
          cancel: "Betal bike",
          exit: "Derkeve"
        }
      }
    };

    // تهيئة i18next
    i18next.init({
      lng: 'en', // اللغة الافتراضية
      resources
    }, function() {
      updateContent();
    });

    // دالة لتحديث النصوص حسب اللغة
    function updateContent() {
      document.getElementById('welcome').innerText = i18next.t('welcome_message');
      document.getElementById('login').innerText = i18next.t('login');
      document.getElementById('logout').innerText = i18next.t('logout');
      document.getElementById('save').innerText = i18next.t('save');
      document.getElementById('cancel').innerText = i18next.t('cancel');
      document.getElementById('exit').innerText = i18next.t('exit');
      document.getElementById('settings').innerText = i18next.t('settings');
      document.getElementById('language').innerText = i18next.t('language');
    }

    // دالة لتغيير اللغة
    function changeLanguage(lang) {
      i18next.changeLanguage(lang, updateContent);
    }
  </script>
</body>
</html>
