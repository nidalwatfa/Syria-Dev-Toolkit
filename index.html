<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>i18n Example</title>
  <script src="https://unpkg.com/i18next@21.6.16/dist/umd/i18next.min.js"></script>
</head>
<body>
  <h1 id="welcome"></h1>
  <button onclick="changeLanguage('ar')">العربية</button>
  <button onclick="changeLanguage('en')">English</button>
  <button onclick="changeLanguage('ku')">Kurdî</button>

  <script>
    // الموارد (النصوص المترجمة)
    const resources = {
      ar: {
        translation: {
          welcome_message: "مرحباً بك!",
          settings: "الإعدادات"
        }
      },
      en: {
        translation: {
          welcome_message: "Welcome!",
          settings: "Settings"
        }
      },
      ku: {
        translation: {
          welcome_message: "Slav û bi xêr hatî!",
          settings: "Mîheng"
        }
      }
    };

    // تهيئة i18next
    i18next.init({
      lng: 'en', // اللغة الافتراضية
      resources
    }, function() {
      updateContent();
    });

    // دالة لتحديث النصوص حسب اللغة
    function updateContent() {
      document.getElementById('welcome').innerText = i18next.t('welcome_message');
    }

    // دالة لتغيير اللغة
    function changeLanguage(lang) {
      i18next.changeLanguage(lang, updateContent);
    }
  </script>
</body>
</html>
